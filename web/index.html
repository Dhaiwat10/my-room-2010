<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>My Room, 2010</title>

<!-- the look of the menus of the time (FIFA 08/09): condensed capitals on square black slats -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4efe6; --muted: #b9b2a6; --panel: rgba(20, 18, 16, 0.78); }
  html, body { margin: 0; height: 100%; background: #111; color: var(--ink); overflow: hidden;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  #gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  /* the XP machine, placed on the monitor's screen in 3D (main.js). Always running and
     visible; it only takes clicks and keys once you've sat up to it. */
  #css3d { position: fixed; inset: 0; pointer-events: none; }
  /* The panel: a 2008 ViewSonic TN LCD with a CCFL backlight, not a modern screen.
     What that looked like, layer by layer (none of the layers take clicks):
       - low contrast: blacks are a glowing blue-grey, never black; colours a bit washed out
       - a cool, slightly blue white point from the fluorescent backlight
       - a touch soft, from the matte anti-glare coating
       - backlight bleed: cloudy, brighter patches creeping in from the edges and corners
       - TN viewing angle: the lower part of the panel paler than the top, seen from a chair
       - the coating's fine sparkle, and the pixel grid, both only noticeable up close
       - a haze of light spilling past the edges onto the bezel (colour set live in main.js) */
  #monitor { position: relative; width: 1024px; height: 640px; background: #10141c; pointer-events: none;
    box-shadow: 0 0 34px 6px var(--haze, rgba(0, 0, 0, 0)); transition: box-shadow .4s; }
  #screen { position: absolute; inset: 0; width: 1024px; height: 640px; border: 0; background: #000;
    pointer-events: none; filter: contrast(0.89) saturate(0.91) brightness(1.03) blur(0.2px); }
  #screen.on { pointer-events: auto; }
  .lcd { position: absolute; inset: 0; pointer-events: none; }
  .lcd-blacks { background: rgb(24, 30, 46); mix-blend-mode: lighten; opacity: 0.4; }
  .lcd-cool { background: rgb(232, 240, 255); mix-blend-mode: multiply; }
  .lcd-bleed { mix-blend-mode: screen; background:
      radial-gradient(38% 30% at 0% 0%, rgba(150, 175, 230, 0.16), transparent 70%),
      radial-gradient(38% 30% at 100% 0%, rgba(150, 175, 230, 0.12), transparent 70%),
      radial-gradient(40% 32% at 0% 100%, rgba(150, 175, 230, 0.18), transparent 70%),
      radial-gradient(40% 32% at 100% 100%, rgba(150, 175, 230, 0.15), transparent 70%),
      radial-gradient(70% 14% at 50% 100%, rgba(150, 175, 230, 0.10), transparent 80%),
      radial-gradient(60% 50% at 50% 50%, rgba(255, 255, 255, 0.03), transparent 80%); }
  .lcd-angle { mix-blend-mode: soft-light; background:
      linear-gradient(to bottom, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0) 45%, rgba(255, 255, 255, 0.18)); }
  .lcd-grain { opacity: 0.04; mix-blend-mode: overlay; background-size: 160px 160px; background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .lcd-grid { opacity: 0; transition: opacity .6s; mix-blend-mode: multiply; background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px 3px); }
  /* up close the grid and grain show, and the backlight glare gets in your eyes */
  #monitor.close .lcd-grid { opacity: 0.16; }
  #monitor.close .lcd-grain { opacity: 0.06; }
  #monitor.close { box-shadow: 0 0 40px 8px var(--haze, rgba(0, 0, 0, 0)); }
  /* loading: a thin bar, nothing else; it fades away to the scene */
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0a09;
    transition: opacity .8s; z-index: 10; }
  #loader.gone { opacity: 0; pointer-events: none; }
  #bar { width: 160px; height: 2px; background: #241f1a; border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #d9b98a; transition: width .25s; }
  #hud { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel); padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted);
    white-space: nowrap; transition: opacity .4s; pointer-events: none; }
  /* sits in the dark margin left of the monitor rather than over the desktop */
  #back { position: fixed; top: 50%; transform: translateY(-50%); left: max(8px, env(safe-area-inset-left));
    background: var(--panel); color: var(--ink); border: 0; border-radius: 999px; padding: 10px 12px;
    font: inherit; font-size: 13px; cursor: pointer; display: none; z-index: 5; }
  /* the volume knob's level, drawn faintly around it while you turn it */
  #dial { position: fixed; pointer-events: none; opacity: 0; transition: opacity .35s; z-index: 4; }
  #dial svg { width: 100%; height: 100%; overflow: visible; }
  #dial path { fill: none; stroke-linecap: round; }
  #dial .track { stroke: rgba(255, 235, 200, 0.18); stroke-width: 2.2; }
  #dial .level { stroke: rgba(255, 214, 150, 0.75); stroke-width: 2.6; }
  #dial .tip { fill: rgba(255, 230, 190, 0.95); }
  /* a game-style mute toggle in the corner */
  #mute { position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    width: 38px; height: 38px; padding: 9px; border: 0; border-radius: 50%; background: var(--panel);
    color: var(--ink); cursor: pointer; z-index: 6; opacity: 0.7; transition: opacity .2s; }
  #mute:hover { opacity: 1; }
  #mute svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  #mute .x { display: none; }
  #mute.off .waves { display: none; }
  #mute.off .x { display: inline; }
  /* the discs you can put in the DVD drive, shown while its tray is open and empty */
  #shelf { position: fixed; left: 50%; bottom: max(54px, calc(env(safe-area-inset-bottom) + 44px)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px);
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 5; }
  #shelf.on { opacity: 1; pointer-events: auto; }
  #shelf button { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--ink); border: 0;
    border-radius: 999px; padding: 5px 14px 5px 5px; font: inherit; font-size: 13px; cursor: pointer; }
  #shelf img { width: 34px; height: 34px; border-radius: 50%; display: block; }
  #inspect, #bey { position: fixed; inset: 0; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .35s;
    background: radial-gradient(ellipse at 50% 42%, rgba(255, 236, 210, 0.07), rgba(0, 0, 0, 0.45) 75%);
    -webkit-backdrop-filter: blur(14px) brightness(0.5) saturate(0.85); backdrop-filter: blur(14px) brightness(0.5) saturate(0.85); }
  #inspect.on, #bey.on { opacity: 1; pointer-events: auto; }
  #inspect canvas, #bey canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #inspect canvas.held { cursor: grabbing; }
  .inspect-card { position: absolute; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
    transform: translate(-50%, 8px); transition: transform .45s cubic-bezier(.2, .8, .2, 1); text-align: center;
    width: max-content; max-width: calc(100vw - 32px); }
  #inspect.on .inspect-card, #bey.on .inspect-card { transform: translate(-50%, 0); }
  .inspect-title { font-size: 20px; font-weight: 600; letter-spacing: 0.01em; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); }
  .inspect-hint { font-size: 12px; color: var(--muted); margin: 2px 0 14px; }
  .inspect-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .inspect-actions button { font: inherit; font-size: 14px; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 1px solid rgba(244, 239, 230, 0.18); }
  .inspect-actions button.primary { background: var(--ink); color: #17130f; border-color: transparent; font-weight: 600; }
  .inspect-badge { font-size: 12px; color: #9fe3a6; min-height: 0; }
  .inspect-badge:empty { display: none; }
  .inspect-shelf { display: none; justify-content: center; gap: 8px; margin: 0 0 14px; }
  #inspect.browse .inspect-shelf { display: flex; }
  /* each game's cover, cut straight out of its box print: the front is the second cell across */
  .inspect-shelf button { width: 40px; height: 56px; padding: 0; border: 0; border-radius: 3px; cursor: pointer;
    background-size: 253.4% auto; background-position: 17.41% 50%; background-color: #222;
    opacity: 0.55; transform: translateY(0); transition: opacity .2s, transform .2s, box-shadow .2s; }
  .inspect-shelf button.on { opacity: 1; transform: translateY(-4px); box-shadow: 0 0 0 2px var(--ink), 0 6px 18px rgba(0, 0, 0, 0.5); }
  .inspect-shelf button:hover { opacity: 0.9; }
  .inspect-nav { position: absolute; top: 42%; transform: translateY(-50%); display: none; width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid rgba(244, 239, 230, 0.18); background: var(--panel); color: var(--ink);
    font-size: 24px; line-height: 1; cursor: pointer; }
  #inspect.browse .inspect-nav { display: block; }
  .inspect-nav.prev { left: max(16px, calc(50% - min(42vw, 420px))); }
  .inspect-nav.next { right: max(16px, calc(50% - min(42vw, 420px))); }
  .inspect-actions button:disabled { opacity: 0.5; cursor: default; }
  .inspect-actions button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); padding: 4px 9px; border-radius: 6px;
    font-size: 12px; display: none; transform: translate(12px, 12px); }
  #rotate { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; background: var(--panel);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--muted); display: none; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  /* The look, after FIFA 08/09's menus: condensed capitals, square black slats with a thin white rim,
     the main choice a solid white slat, and the room greyed out behind a close look */
  :root { --ink: #f5f5f2; --panel: rgba(6, 6, 6, 0.82); --rim: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    --caps: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow Semi Condensed", "Arial Narrow", sans-serif; }
  html, body { font-family: var(--body); }
  #hud { border-radius: 0; font: 600 15px var(--body); text-transform: uppercase; letter-spacing: .04em; color: #ddd;
    background: rgba(0, 0, 0, 0.78); box-shadow: var(--rim); padding: 7px 16px; }
  #back, #shelf button, #mute { border-radius: 0; box-shadow: var(--rim); }
  #back, #shelf button { font: 700 16px var(--caps); text-transform: uppercase; letter-spacing: .04em; }
  #back { font-size: 17px; }
  #tip { border-radius: 0; font: 700 14px var(--caps); text-transform: uppercase; letter-spacing: .04em; background: #fff; color: #000; }
  #inspect, #bey { background: rgba(0, 0, 0, 0.35);
    -webkit-backdrop-filter: blur(12px) brightness(0.5) grayscale(0.75); backdrop-filter: blur(12px) brightness(0.5) grayscale(0.75); }
  .inspect-title { font: 800 34px/1 var(--caps); text-transform: uppercase; letter-spacing: .01em; }
  .inspect-hint { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .06em; color: #aaa; margin: 6px 0 16px; }
  .inspect-actions button { border-radius: 0; border: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7); background: rgba(0, 0, 0, 0.7);
    font: 700 17px var(--caps); text-transform: uppercase; letter-spacing: .05em; padding: 11px 24px; transform: skewX(-14deg); }
  .inspect-actions button.primary { background: linear-gradient(#fff, #d6d6d6); color: #000; box-shadow: none; }
  .inspect-shelf button { border-radius: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); filter: grayscale(0.8); }
  .inspect-shelf button.on { filter: none; box-shadow: 0 0 0 2px #fff, 0 6px 18px rgba(0, 0, 0, 0.6); }
  .inspect-nav { border-radius: 0; border: 1px solid rgba(255, 255, 255, 0.7); background: rgba(0, 0, 0, 0.7); font: 700 26px var(--caps); }
  .inspect-badge { display: inline-block; font: 700 12px var(--caps); letter-spacing: .1em; text-transform: uppercase;
    color: #000; background: #fff; padding: 3px 7px; margin-top: 6px; }
  /* the Beyblade stadium: choosing a top, the countdown, the ripcord, and both tops' spin */
  #bey canvas { cursor: crosshair; }
  body.bey-open #mute { z-index: 30; }
  #bey .bey-tops { display: flex; justify-content: center; gap: 8px; margin: 0 0 14px; }
  #bey .bey-tops:empty { display: none; }
  #bey .bey-tops button { background: rgba(0, 0, 0, 0.7); border: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    padding: 4px; cursor: pointer; line-height: 0; transition: transform .15s; }
  #bey .bey-tops button img { width: 84px; height: 84px; display: block; }
  #bey .bey-tops button:hover { transform: translateY(-2px); }
  #bey .bey-tops button.on { background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.12) 70%); box-shadow: inset 0 0 0 2px #fff; }
  .bey-call { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) skewX(-10deg); pointer-events: none;
    font: 800 clamp(44px, 9vw, 110px)/1 var(--caps); text-transform: uppercase; color: #fff; letter-spacing: .02em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .bey-call.on { opacity: 1; }
  .bey-call.pop { animation: beypop .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes beypop { from { transform: translate(-50%, -50%) skewX(-10deg) scale(1.5); opacity: 0; } }
  .bey-meters { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .bey-meters.on { opacity: 1; }
  .bey-meter { width: min(36vw, 240px); background: rgba(0, 0, 0, 0.7); box-shadow: var(--rim); padding: 4px 10px 4px 4px;
    display: flex; align-items: center; gap: 8px; }
  .bey-meter span img { width: 36px; height: 36px; display: block; }
  .bey-meter b { display: block; flex: 1; height: 6px; background: rgba(255, 255, 255, 0.15); }
  .bey-meter.cpu { flex-direction: row-reverse; padding: 4px 4px 4px 10px; }
  .bey-meter b i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; }
  .bey-meter.cpu { text-align: right; }
  .bey-meter.cpu b i { transform-origin: right; margin-left: auto; }
  .bey-cord { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bey.slim .inspect-title { display: none; }
  #bey .inspect-hint:empty { display: none; }
  .bey-grade { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%) skewX(-10deg); pointer-events: none;
    font: 800 clamp(26px, 4.5vw, 52px)/1 var(--caps); text-transform: uppercase; letter-spacing: .04em; opacity: 0; transition: opacity .2s;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.8); white-space: nowrap; }
  .bey-grade.on { opacity: 1; }
  .bey-grade.good { color: #ffd23f; }
  .bey-grade.bad { color: #ff8a80; }
  .bey-grade.pop { animation: beypop .4s cubic-bezier(.2, .8, .2, 1); }
  .bey-gauge { position: absolute; right: max(24px, 8vw); top: 50%; transform: translateY(-50%); width: 34px; height: min(46vh, 320px);
    pointer-events: none; opacity: 0; transition: opacity .2s; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font: 700 13px var(--caps); text-transform: uppercase; letter-spacing: .08em; color: #fff; }
  .bey-gauge.on { opacity: 1; }
  .bey-gauge b { position: relative; flex: 1; width: 100%; background: rgba(0, 0, 0, 0.7); box-shadow: var(--rim); overflow: hidden; }
  .bey-gauge i { position: absolute; inset: 0; transform-origin: bottom; transform: scaleY(0);
    background: linear-gradient(to top, #2f62b8, #ff4a3a 70%, #ffd23f); }
  .bey-gauge em { position: absolute; left: 0; right: 0; top: 0; height: 6%; border-bottom: 2px solid #fff; background: rgba(255, 210, 63, 0.25); }
  .bey-gauge.hot b { box-shadow: 0 0 0 2px #ffd23f, 0 0 24px rgba(255, 210, 63, 0.7); }
  .bey-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  /* what to do right now, over your top */
  .bey-prompt { position: absolute; transform: translate(-50%, -100%) skewX(-8deg); pointer-events: none; text-align: center; opacity: 0;
    transition: opacity .2s; font: 800 clamp(22px, 3vw, 34px)/1.05 var(--caps); text-transform: uppercase; letter-spacing: .03em; color: #fff;
    background: rgba(0, 0, 0, 0.72); box-shadow: var(--rim); padding: 10px 18px 9px; white-space: nowrap; }
  .bey-prompt small { display: block; font: 600 13px var(--body); letter-spacing: .06em; color: #bbb; margin-top: 4px; }
  .bey-prompt.on { opacity: 1; }
  .bey-prompt.wait { animation: beybreathe 1.2s ease-in-out infinite; }
  .bey-prompt.hold { color: #ffd23f; }
  .bey-prompt.rip { color: #7dff9a; }
  .bey-prompt.pop { animation: beypop2 .35s cubic-bezier(.2, .8, .2, 1); }
  .bey-prompt.wait.pop { animation: beypop2 .35s cubic-bezier(.2, .8, .2, 1), beybreathe 1.2s ease-in-out .35s infinite; }
  @keyframes beybreathe { 50% { transform: translate(-50%, -100%) skewX(-8deg) scale(1.06); } }
  @keyframes beypop2 { from { transform: translate(-50%, -100%) skewX(-8deg) scale(1.3); opacity: 0; } }
  /* how to play */
  .bey-tut { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); z-index: 2; }
  .bey-tut.on { display: flex; }
  .bey-tut-card { width: min(520px, calc(100vw - 32px)); background: rgba(8, 8, 8, 0.94); box-shadow: var(--rim); padding: 22px 26px 22px; text-align: center; }
  .bey-tut-art { height: 150px; display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 10px; }
  .bey-tut-step { font: 700 12px var(--caps); letter-spacing: .14em; text-transform: uppercase; color: #888; }
  .bey-tut-title { font: 800 34px/1.1 var(--caps); text-transform: uppercase; color: #fff; margin: 2px 0 8px; }
  .bey-tut-text { font: 500 16px/1.45 var(--body); color: #ddd; margin-bottom: 18px; }
  .bey-tut-text b { color: #ffd23f; font-weight: 700; }
  .art-gauge { position: relative; width: 30px; height: 130px; background: rgba(255, 255, 255, 0.08); box-shadow: var(--rim); overflow: hidden; }
  .art-gauge i { position: absolute; inset: 0; transform-origin: bottom; background: linear-gradient(to top, #2f62b8, #ff4a3a 70%, #ffd23f); animation: artgauge 0.65s ease-in-out infinite alternate; }
  .art-gauge em { position: absolute; left: 0; right: 0; top: 0; height: 7%; border-bottom: 2px solid #fff; background: rgba(255, 210, 63, 0.3); }
  @keyframes artgauge { from { transform: scaleY(0.04); } to { transform: scaleY(1); } }
  .art-hand { font: 800 22px var(--caps); text-transform: uppercase; color: #fff; padding: 8px 14px; box-shadow: var(--rim); animation: beyhold 2.3s ease-in-out infinite; }
  @keyframes beyhold { 0%, 100% { background: #fff; color: #000; } 49% { background: #fff; color: #000; } 50%, 99% { background: transparent; color: #fff; } }
  .art-rip { position: relative; width: 150px; height: 150px; }
  .art-rip b { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border: 3px solid #fff; border-radius: 50%; }
  .art-rip i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border: 4px solid #ffd23f; border-radius: 50%; animation: artring 1.6s linear infinite; }
  .art-rip span { position: absolute; left: 0; right: 0; bottom: -2px; font: 800 18px var(--caps); text-transform: uppercase; color: #7dff9a; opacity: 0; animation: artrip 1.6s linear infinite; }
  @keyframes artring { 0% { transform: scale(3.4); border-color: #ffd23f; } 72% { border-color: #ffd23f; } 75% { transform: scale(1); border-color: #7dff9a; } 80% { transform: scale(1); opacity: 1; } 90%, 100% { transform: scale(1); opacity: 0; } }
  @keyframes artrip { 0%, 73% { opacity: 0; } 76%, 92% { opacity: 1; } 100% { opacity: 0; } }
  .art-win { display: flex; align-items: center; gap: 14px; font: 800 28px var(--caps); text-transform: uppercase; color: #fff; }
  .art-win span { padding: 8px 14px; box-shadow: var(--rim); transform: skewX(-10deg); }
  .art-win span:first-child { background: #fff; color: #000; }
  .art-win em { font: 600 15px var(--body); color: #888; font-style: normal; }
  /* phones on their side: a slimmer card, so the stadium keeps most of the screen */
  @media (max-height: 520px) {
    #bey .inspect-card { bottom: max(10px, env(safe-area-inset-bottom)); }
    #bey .inspect-title { font-size: 22px; }
    #bey .inspect-hint { font-size: 11px; margin: 3px 0 8px; }
    #bey .bey-tops { margin-bottom: 8px; gap: 6px; }
    #bey .bey-tops button img { width: 60px; height: 60px; }
    #bey .inspect-actions button { font-size: 14px; padding: 7px 18px; }
    .bey-meter span img { width: 28px; height: 28px; }
